<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action 'none'; base-uri 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — KoHs Mod Suite</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#a855f7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800..900&amp;family=JetBrains+Mono:wght@500&amp;family=Outfit:wght@400..600&amp;display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px;
      font-family: 'Outfit', system-ui, sans-serif; color: #f6eeff; text-align: center;
      background:
        radial-gradient(60vmax 60vmax at 0% 0%, rgba(124, 58, 237, .45), transparent 60%),
        radial-gradient(50vmax 50vmax at 100% 100%, rgba(255, 79, 184, .28), transparent 60%),
        #07030d;
    }
    .code {
      margin: 0; font-family: 'Grenze Gotisch', serif; font-weight: 900; line-height: .9;
      font-size: clamp(120px, 32vw, 260px);
      background: linear-gradient(115deg, #7c3aed, #a855f7 38%, #e879f9 70%, #ff4fb8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 30px rgba(168, 85, 247, .5));
    }
    .prompt { margin: 18px 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9a86bd; }
    .prompt b { color: #ff4fb8; }
    p { margin: 0 0 28px; font-size: 18px; color: #cdbbe8; }
    a {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px;
      font-weight: 600; color: #fff; text-decoration: none;
      background: linear-gradient(115deg, #7c3aed, #a855f7 38%, #e879f9 70%, #ff4fb8);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    a:focus-visible { outline: 2px solid #ff4fb8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1 class="code">404</h1>
    <p class="prompt"><b>~/kohs $</b> find page → not found</p>
    <p>This block doesn't exist — it may have been mined away.</p>
    <a href="/KoHs-Mod-Suite/">Back to KoHs Mod Suite</a>
  </main>
</body>
</html>
